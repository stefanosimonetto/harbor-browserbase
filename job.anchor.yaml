# Same suite and models as job.kernel.yaml / job.glm.yaml, but the browser is an
# Anchor Browser cloud session (https://anchorbrowser.io). AnchorEnvironment
# creates one session per trial and hands its CDP URL to Stagehand, which attaches
# via environment/patches/remote-cdp.patch. Needs ANCHOR_API_KEY and
# OPENROUTER_API_KEY; no Browserbase or Kernel credentials.
job_name: anchor-smoke-suite-glm
jobs_dir: jobs/anchor
# Each trial holds one Anchor session, so keep this within your Anchor plan's
# concurrent-session limit.
n_concurrent_trials: 3

datasets:
  - path: tasks

environment:
  import_path: bb_harbor.anchor_env:AnchorEnvironment
  kwargs:
    # Anchor blocks ads and popups/consent banners by default; Browserbase and
    # Kernel do not. Off keeps pages comparable across the three backends.
    adblock: false
    popup_blocker: false
    headless: false
    # Session recording costs extra; Stagehand already captures screenshots.
    recording: false
    # Hard cap per session; must exceed the agent timeout (900 s = 15 min).
    max_duration_minutes: 25
    idle_timeout_minutes: 5
    delete_on_start_failure: true

agents:
  - import_path: bb_harbor.agent:StagehandAgent
    model_name: openrouter/z-ai/glm-5.3-flash
    kwargs:
      mode: dom
    env:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      STAGEHAND_EXECUTION_MODEL: openrouter/z-ai/glm-5.3-flash
      STAGEHAND_JUDGE_MODEL: openrouter/z-ai/glm-5.3-flash

verifier:
  import_path: bb_harbor.verifier:StagehandVerifier
  env:
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  kwargs:
    judge_model: openrouter/z-ai/glm-5.3-flash
