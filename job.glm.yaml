# Same suite as job.openrouter.yaml, but every model call (agent, agent
# execution model, in-run judge, fallback judge) uses GLM 5.3 Flash via
# OpenRouter instead of Gemini. Requires environment/patches/openrouter-provider.patch
# in the task image. Only OPENROUTER_API_KEY is needed; no GEMINI_API_KEY.
# cua mode is not supported here: Stagehand's CUA clients call vendor APIs directly.
job_name: browserbase-smoke-suite-glm
jobs_dir: jobs/browserbase
n_concurrent_trials: 3

datasets:
  - path: tasks

environment:
  import_path: bb_harbor.env:BrowserbaseEnvironment
  kwargs:
    create_session: false
    delete_on_start_failure: true

agents:
  - import_path: bb_harbor.agent:StagehandAgent
    model_name: openrouter/z-ai/glm-5.3-flash
    kwargs:
      mode: dom
    env:
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Stagehand hardcodes google/gemini-2.5-flash for act/extract steps and
      # for the judge that scores the run; point both at GLM via OpenRouter.
      STAGEHAND_EXECUTION_MODEL: openrouter/z-ai/glm-5.3-flash
      STAGEHAND_JUDGE_MODEL: openrouter/z-ai/glm-5.3-flash

verifier:
  import_path: bb_harbor.verifier:StagehandVerifier
  env:
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  kwargs:
    judge_model: openrouter/z-ai/glm-5.3-flash
